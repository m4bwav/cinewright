name: ci

# The repository is public, so GitHub-hosted runners are free (PLAN D6).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.x']
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build; Windows and macOS cover 3.9.
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (qc, voice and look tests)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Knowledge-base lint (schemas, links, copies, manifests, hygiene)
        run: python scripts/cine.py kb lint
      - name: Size budget (fails at red)
        run: python scripts/cine.py budget
      - name: Worked example passes
        run: |
          python scripts/cine.py cards validate examples/three-shot
          python scripts/cine.py continuity diff examples/three-shot
      - name: Plugin manifests
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            for d in . plugins/cinewright plugins/cinewright-craft plugins/cinewright-dev; do claude plugin validate "$d"; done
          else
            echo "claude CLI not on this runner; plugin validate skipped"
          fi
